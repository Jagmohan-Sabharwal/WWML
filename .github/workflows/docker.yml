name: Docker platform
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Configure local environment
        run: cp .env.example .env
      - name: Validate development configuration
        run: docker compose config --quiet
      - name: Build and start development services
        run: docker compose up --build --wait --wait-timeout 180
      - name: Apply migrations in development image
        run: docker compose exec -T backend alembic upgrade head
      - name: Verify requests and dependency connectivity
        run: |
          curl --fail http://localhost:8000/health | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"healthy"}'
          curl --fail http://localhost:8000/health/ready | python3 -c 'import json,sys; assert json.load(sys.stdin) == {"status":"ok","checks":{"postgres":True,"redis":True}}'
          curl --fail http://localhost:3000/ | grep -q WWML
          curl --fail http://localhost:3000/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["status"] == "ok"'
      - name: Verify development Assets API
        run: python3 backend/scripts/smoke_assets.py
      - name: Stop development services
        run: docker compose down
      - name: Build and start production images without source mounts
        run: docker compose -f docker-compose.yml -f docker-compose.production.yml up --build --wait --wait-timeout 180
      - name: Check migrations in production image
        run: docker compose exec -T backend alembic upgrade head
      - name: Verify production requests
        run: |
          curl --fail http://localhost:3000/ | grep -q WWML
          curl --fail http://localhost:3000/api/health | python3 -c 'import json,sys; assert json.load(sys.stdin)["checks"] == {"postgres":True,"redis":True}'
      - name: Verify production Assets API
        run: python3 backend/scripts/smoke_assets.py
      - name: Container logs
        if: always()
        run: docker compose logs --no-color
      - name: Cleanup
        if: always()
        run: docker compose down --volumes
